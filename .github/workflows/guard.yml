name: HolyMoly-vagt

on:
  push:
    paths: ['agent/guard/**', 'agent/build/**', 'test/guard/**', 'shared/**', 'server/src/**', '.github/workflows/guard.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm ci --prefix server
      - name: Vagt-test (Windows PowerShell 5.1 som administrator)
        shell: powershell
        run: .\test\guard\windows-test.ps1

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: npm ci --prefix server
      - name: Vagt-test (bash som root)
        run: sudo -E env "PATH=$PATH" bash test/guard/mac-test.sh
