name: HolyMoly-vagt

on:
  push:
    paths: ['agent/guard/**', 'agent/build/**', 'test/guard/**', 'shared/**', 'server/src/**', '.github/workflows/guard.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --prefix server
      - name: Vagt-test (Windows PowerShell 5.1 som administrator)
        shell: powershell
        run: .\test\guard\windows-test.ps1

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: npm ci --prefix server
      - name: Vagt-test (bash som root)
        run: sudo -E env "PATH=$PATH" bash test/guard/mac-test.sh
