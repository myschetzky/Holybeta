# Udgiver HolyMoly's hjemmeside på GitHub Pages (https://<bruger>.github.io/<repo>/): forside med priser,
# jura, hent-side og demoen (det rigtige lærer-dashboard med en simuleret klasse), bygget af scripts/build-pages.js.
# Slå Pages til én gang: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: GitHub Pages (demo)

on:
  push:
    paths:
      - 'server/public/**'
      - 'scripts/build-pages.js'
      - 'scripts/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Kun fra repoets standard-gren (GitHub Pages tillader som standard kun den)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Byg hjemmesiden og demoen
        run: node scripts/build-pages.js
        env:
          # Sæt under Settings → Secrets and variables → Actions → Variables, når HolyMoly er hostet
          HOLYMOLY_APP_URL: ${{ vars.HOLYMOLY_APP_URL }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          COMPANY_CVR: ${{ vars.COMPANY_CVR }}
          COMPANY_EMAIL: ${{ vars.COMPANY_EMAIL }}
          COMPANY_ADDRESS: ${{ vars.COMPANY_ADDRESS }}
          HOSTING_PROVIDER: ${{ vars.HOSTING_PROVIDER }}
          PRICE_PER_STUDENT: ${{ vars.PRICE_PER_STUDENT }}
          PRICE_MINIMUM: ${{ vars.PRICE_MINIMUM }}
      - name: Er GitHub Pages slået til?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "::error title=GitHub Pages er ikke slået til::Gå til Settings → Pages → Build and deployment → Source og vælg 'GitHub Actions'. Er repoet privat, kræver Pages GitHub Pro/Team – ellers gør repoet offentligt. Kør derefter dette workflow igen (Actions → GitHub Pages (demo) → Run workflow)."
            exit 1
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
