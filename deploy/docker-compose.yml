# Kør fra repo-roden:  docker compose -f deploy/docker-compose.yml up -d
# Udfyld deploy/.env først. Beta til én skole: se deploy/.env.beta.example og docs/PROXMOX.md.
# Den fulde udgave med licenser: se deploy/.env.example og docs/SALG.md.
services:
  holymoly:
    build: { context: .., dockerfile: server/Dockerfile }
    restart: unless-stopped
    # Alle indstillinger står her (ingen env_file): kun det, der er nævnt, når ind i containeren.
    environment:
      # Udgave: 1 = enkel tilstand (beta til én skole), 0 = den fulde udgave med kontoer og licenser
      SIMPLE: ${SIMPLE:-1}
      # 1 = skolen driver serveren og har nøglen. 0 = testserver: beviserne mærkes "Testserver"
      SCHOOL_OPERATED: ${SCHOOL_OPERATED:-0}
      # Skolens ja. Uden alle fire startes ingen lektioner i enkel tilstand (se docs/ENKEL.md)
      DATAANSVARLIG: ${DATAANSVARLIG:-}
      DPO_KONTAKT: ${DPO_KONTAKT:-}
      DPIA_DATO: ${DPIA_DATO:-}
      LEDELSE_JA_DATO: ${LEDELSE_JA_DATO:-}
      # Driften (beta): dato for databehandleraftalen med den, der driver serveren (en voksen eller juridisk person).
      # Uden den (og uden overdragelse til skolens IT) startes ingen lektioner i enkel tilstand
      DBA_DATO: ${DBA_DATO:-}
      # Hvem driver serveren – en rolle, ikke et navn (står på forsiden), fx "en lærer på skolen"
      DRIFTSANSVARLIG: ${DRIFTSANSVARLIG:-}
      # Beta-funktioner, der er slået fra som standard: liveScreen, screenshot, autoEvidence, similar (fx "liveScreen,screenshot")
      BETA_FEATURES: ${BETA_FEATURES:-}
      # 1 = Windows/Mac-elever skal have HolyMoly-vagten for at være grønne. Fra i beta
      REQUIRE_GUARD: ${REQUIRE_GUARD:-0}
      # Ældste elev-app og browserudvidelse, der må forbinde (tom = alle)
      MIN_AGENT_VERSION: ${MIN_AGENT_VERSION:-}
      MIN_EXTENSION_VERSION: ${MIN_EXTENSION_VERSION:-}
      EXTENSION_URL_CHROME: ${EXTENSION_URL_CHROME:-}
      EXTENSION_URL_EDGE: ${EXTENSION_URL_EDGE:-}
      EXTENSION_URL_FIREFOX: ${EXTENSION_URL_FIREFOX:-}
      TEACHER_SIGNUP_CODE: ${TEACHER_SIGNUP_CODE:-}
      # Kontoer, skoler og licenser
      LICENSING: ${LICENSING:-1}
      TRIAL_DAYS: ${TRIAL_DAYS:-30}
      PRICE_PER_STUDENT: ${PRICE_PER_STUDENT:-129}
      PRICE_MINIMUM: ${PRICE_MINIMUM:-2500}
      REQUIRE_2FA: ${REQUIRE_2FA:-1}
      VERIFY_EMAIL: ${VERIFY_EMAIL:-}
      SIGNUP: ${SIGNUP:-open}
      PLATFORM_ADMINS: ${PLATFORM_ADMINS:-}
      SALES_EMAIL: ${SALES_EMAIL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      COMPANY_NAME: ${COMPANY_NAME:-HolyMoly}
      COMPANY_CVR: ${COMPANY_CVR:-}
      COMPANY_ADDRESS: ${COMPANY_ADDRESS:-}
      COMPANY_EMAIL: ${COMPANY_EMAIL:-}
      HOSTING_PROVIDER: ${HOSTING_PROVIDER:-}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      # Frister (se server/src/retention.js). Tomme værdier = standarden i retention.js
      BACKUP_DAYS: ${BACKUP_DAYS:-}
      DRAFT_DAYS: ${DRAFT_DAYS:-}
      VERSIONS_DAYS: ${VERSIONS_DAYS:-}
      DOC_RETENTION_DAYS: ${DOC_RETENTION_DAYS:-}
      CERT_YEARS: ${CERT_YEARS:-}
      INACTIVE_STUDENT_DAYS: ${INACTIVE_STUDENT_DAYS:-}
      AUDIT_DAYS: ${AUDIT_DAYS:-}
      PURGE_AFTER_DAYS: ${PURGE_AFTER_DAYS:-90}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
      SECURITY_CONTACT: ${SECURITY_CONTACT:-}
      AGENT_DOWNLOAD_URL: ${AGENT_DOWNLOAD_URL:-}
      # Kun disse proxyer må sætte X-Forwarded-For (værtsnavne i compose-netværket, IP-adresser eller net)
      TRUST_PROXY: ${TRUST_PROXY:-caddy,cloudflared}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # UNI-Login (tomme = slået fra)
      UNILOGIN_ISSUER: ${UNILOGIN_ISSUER:-}
      UNILOGIN_CLIENT_ID: ${UNILOGIN_CLIENT_ID:-}
      UNILOGIN_CLIENT_SECRET: ${UNILOGIN_CLIENT_SECRET:-}
      UNILOGIN_REDIRECT_URI: ${UNILOGIN_REDIRECT_URI:-}
      UNILOGIN_SCOPE: ${UNILOGIN_SCOPE:-openid}
      UNILOGIN_ROLE_CLAIM: ${UNILOGIN_ROLE_CLAIM:-aktoer_gruppe}
      UNILOGIN_TEACHER_ROLES: ${UNILOGIN_TEACHER_ROLES:-}
      UNILOGIN_ID_CLAIM: ${UNILOGIN_ID_CLAIM:-uniid}
      UNILOGIN_ACR: ${UNILOGIN_ACR:-}
      UNILOGIN_OPTIONAL: ${UNILOGIN_OPTIONAL:-0}
    volumes:
      - holymoly-data:/data
    user: "1000:1000"
    # Hærdning: skrivebeskyttet filsystem (kun /data og /tmp kan skrives), ingen Linux-rettigheder, ingen ny root
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      HM_DOMAIN: ${HM_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [holymoly]
volumes:
  holymoly-data:
  caddy-data:
