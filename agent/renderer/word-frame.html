<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;">
  <title>HolyMoly – Word</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="word-frame.css">
</head>
<body>
  <!-- Kanten om Word (musen går igennem) -->
  <div class="frame" aria-hidden="true"></div>

  <!-- HolyMoly-bjælken øverst -->
  <header class="bar hit" id="bar" role="toolbar" aria-label="HolyMoly">
    <img src="../assets/icon.svg" alt="" width="18" height="18">
    <span class="bar-text"><b>HolyMoly</b><span class="sep"> · </span><span id="title">Dokument</span><span class="sep" id="saved-sep" hidden> · </span><span id="saved"></span></span>
    <button class="btn primary" id="done" type="button">Tekst færdig</button>
  </header>

  <!-- Muldvarpen med skiltet nederst til højre -->
  <button class="mole-btn hit" id="mole" type="button" aria-describedby="bubble-text" title="Grå: Venter på Word.">
    <svg class="mole" id="mole-svg" data-color="grey" viewBox="0 0 120 150" width="112" height="140" aria-hidden="true">
      <!-- pind -->
      <rect x="39" y="50" width="7" height="62" rx="2.5" fill="#8a5a2b"/>
      <!-- skilt: fyldt i statusfarven med et hvidt symbol (✓ / ✗ / ?) – læses på afstand og på enhver baggrund -->
      <g class="sign">
        <rect class="sign-board" x="6" y="5" width="74" height="50" rx="10"/>
        <path class="sym sym-ok" d="M26 31 l10 10 l21 -21"/>
        <path class="sym sym-no" d="M31 19 l24 23 M55 19 l-24 23"/>
        <text class="sym sym-q" x="43" y="44" text-anchor="middle">?</text>
      </g>
      <!-- hoved -->
      <ellipse cx="76" cy="118" rx="31" ry="27" fill="#5b4a42"/>
      <ellipse cx="76" cy="131" rx="12" ry="8" fill="#8c7268"/>
      <ellipse cx="76" cy="127.5" rx="6.2" ry="4.6" fill="#f472b6"/>
      <!-- solbriller -->
      <rect x="53" y="106" width="20" height="11" rx="5" fill="#0b1220"/>
      <rect x="79" y="106" width="20" height="11" rx="5" fill="#0b1220"/>
      <path d="M73 110h6" stroke="#0b1220" stroke-width="3"/>
      <!-- spionhat -->
      <path d="M55 101 58 79Q76 71 94 79L97 101Z" fill="#1f2937"/>
      <path d="M67 77.5Q76 82 85 77.5" stroke="#0b1220" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="56.5" y="92" width="39" height="7" fill="#374151"/>
      <ellipse cx="76" cy="101" rx="36" ry="6" fill="#111827"/>
      <!-- poter om pinden -->
      <ellipse cx="42.5" cy="96" rx="8.5" ry="5.5" fill="#e9c7b8"/>
      <ellipse cx="46" cy="108" rx="8.5" ry="5.5" fill="#e9c7b8"/>
      <!-- muldvarpeskud -->
      <path d="M0 150V141Q60 124 120 141V150Z" fill="#7c4a1e"/>
      <path d="M4 143Q60 128 116 143" stroke="#9a5f2a" stroke-width="2" fill="none"/>
    </svg>
  </button>
  <div class="bubble hit" id="bubble" role="status" hidden>
    <span class="b-sym" id="bubble-sym" aria-hidden="true">?</span>
    <p id="bubble-text">Grå: Venter på Word.</p>
    <ul id="bubble-notes"></ul>
  </div>
  <!-- Skærmlæsere hører, når skiltet skifter -->
  <div class="sr-only" id="live" aria-live="polite"></div>

  <!-- Resultat eller valg efter "Tekst færdig" -->
  <section class="panel hit" id="panel" role="dialog" aria-modal="false" aria-labelledby="p-title" hidden>
    <h2 id="p-title"></h2>
    <p id="p-mark" class="mark" hidden></p>
    <p id="p-text"></p>
    <ul id="p-items"></ul>
    <p id="p-note" class="muted" hidden></p>
    <div class="actions" id="p-actions"></div>
  </section>

  <script src="word-frame.js"></script>
</body>
</html>
